name = "madshotz-delivery"
main = "worker.js"
compatibility_date = "2024-11-01"

# R2 bucket that stores the photos. Create it first:
#   npx wrangler r2 bucket create madshotz-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "madshotz-photos"

# KV namespace for the PERMANENT admin data (events + templates). Create it and
# paste the returned id below:
#   npx wrangler kv namespace create madshots-data
[[kv_namespaces]]
binding = "KV"
id = "f6b93d9eb9a24516891807ec4f35cb8e"
